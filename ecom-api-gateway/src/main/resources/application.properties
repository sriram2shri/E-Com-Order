spring.application.name=API-Gateway
server.port = 9090
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
spring.cloud.gateway.server.webflux.routes[0].id = order
spring.cloud.gateway.server.webflux.routes[0].uri = lb://ecom-order-service
spring.cloud.gateway.server.webflux.routes[0].predicates= Path=/orders/**

spring.cloud.gateway.server.webflux.routes[1].id = product
spring.cloud.gateway.server.webflux.routes[1].uri = lb://ecom-inventory-service
spring.cloud.gateway.server.webflux.routes[1].predicates= Path=/inventory/**
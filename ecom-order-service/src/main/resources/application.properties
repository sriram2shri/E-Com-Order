spring.application.name=ecom-order-service
server.port = ${SERVER_PORT:8080}
logging.level.com.example.ecom_order_service.Client=DEBUG
logging.level.com.netflix.discovery=DEBUG
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.registry-fetch-interval-seconds=30
eureka.instance.lease-renewal-interval-in-seconds=30
# resilience4j.ratelimiter.instances.inventoryService.limit-for-period=2
# resilience4j.ratelimiter.instances.inventoryService.limit-refresh-period=30s
# resilience4j.ratelimiter.instances.inventoryService.timeout-duration=0s
logging.level.io.github.resilience4j=DEBUG
resilience4j.circuitbreaker.instances.inventoryService.register-health-indicator=true
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.inventoryService.sliding-window-size=6

resilience4j.circuitbreaker.instances.inventoryService.minimum-number-of-calls=1

resilience4j.circuitbreaker.instances.inventoryService.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.inventoryService.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.inventoryService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.inventoryService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.inventoryService.timeout-duration=2s
resilience4j.timelimiter.instances.inventoryService.cancel-running-future=true
# Disable Spring Cloud LoadBalancer retries
spring.cloud.loadbalancer.retry.enabled=false
spring.cloud.openfeign.client.config.inventoryService.connectTimeout=2000
spring.cloud.openfeign.client.config.inventoryService.readTimeout=30000
# resilience4j.bulkhead.instances.inventoryService.max-concurrent-calls=2
# resilience4j.bulkhead.instances.inventoryService.max-wait-duration=0
resilience4j.threadpool.bulkhead.instances.inventoryService.max-thread-pool-size=2
resilience4j.threadpool.bulkhead.instances.inventoryService.core-thread-pool-size=2
resilience4j.threadpool.bulkhead.instances.inventoryService.queue-capacity=0
# Enable trace sampling
management.tracing.sampling.probability=1.0

# OpenTelemetry Collector endpoint
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces

# Service identification
management.opentelemetry.resource-attributes.service.name=ecom-order-service
management.otlp.metrics.export.url=http://otel-collector:4318/v1/metrics
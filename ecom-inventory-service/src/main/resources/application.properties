spring.application.name=ecom-inventory-service
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/products
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.web.resources.static-locations=file:photos/
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# opentelemtry.tracing.sampling.probability=1.0
# opentelemetry.metrics.export.otlp.endpoint=http://localhost:4317
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=172.27.128.1
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=host.docker.internal
# Enable trace sampling
management.tracing.sampling.probability=1.0

# OpenTelemetry Collector endpoint
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

